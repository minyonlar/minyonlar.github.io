<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>bob</title>

    <link rel="icon" type="image/png" href="bob.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --yellow: #d8bb4c;
            --yellow-soft: #bca54d;
            --yellow-muted: rgba(216, 187, 76, .14);

            --blue: #3d7295;
            --blue-light: #578aa9;
            --blue-dark: #284b63;

            --bg: #10161b;
            --card: #192229;
            --card-light: #1d2830;

            --border: rgba(255, 255, 255, .07);

            --text: #e7ebed;
            --text-soft: #a5afb5;
            --text-muted: #737f87;

            --metal: #78838a;
            --metal-light: #a8b0b4;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 15% 0%,
                    rgba(216, 187, 76, .07),
                    transparent 28%),
                radial-gradient(circle at 90% 90%,
                    rgba(61, 114, 149, .09),
                    transparent 30%),
                var(--bg);

            color: var(--text);

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================
           LOGIN
        ========================================= */

        .login-wrap {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: min(100%, 380px);

            background: rgba(25, 34, 41, .96);

            border: 1px solid var(--border);

            border-radius: 26px;

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .35);
        }

        .login-top {
            padding: 30px 20px 25px;

            text-align: center;

            background:
                linear-gradient(180deg,
                    rgba(216, 187, 76, .15),
                    rgba(216, 187, 76, .04));

            border-bottom:
                1px solid var(--border);

            position: relative;

            overflow: hidden;
        }

        .login-top::after {
            content: "";

            position: absolute;

            width: 160px;
            height: 160px;

            border-radius: 50%;

            background:
                rgba(216, 187, 76, .06);

            left: 50%;
            top: -110px;

            transform: translateX(-50%);
        }

        /* =========================================
           BOB HAIR
        ========================================= */

        .hair {
            position: absolute;

            width: 3px;
            height: 23px;

            background: #252b2f;

            border-radius: 5px;

            top: 5px;

            z-index: 3;
        }

        .hair-1 {
            left: 43%;
            transform: rotate(-18deg);
        }

        .hair-2 {
            left: 50%;
        }

        .hair-3 {
            left: 57%;
            transform: rotate(18deg);
        }

        /* =========================================
           GOGGLES
        ========================================= */

        .goggles {
            width: 140px;
            height: 70px;

            margin: 5px auto 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 2;
        }

        .goggle-band {
            position: absolute;

            left: 6px;
            right: 6px;

            top: 31px;

            height: 8px;

            background: var(--metal);

            opacity: .7;

            border-radius: 10px;
        }

        .eye {
            width: 57px;
            height: 57px;

            background: #d9dddf;

            border-radius: 50%;

            border:
                6px solid var(--metal);

            box-shadow:
                inset 0 0 0 3px #9ca4a8;

            position: relative;

            z-index: 2;
        }

        .eye+.eye {
            margin-left: -7px;
        }

        .pupil {
            width: 15px;
            height: 15px;

            background: #242a2e;

            border-radius: 50%;

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);
        }

        .pupil::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 4px;

            background: white;

            border-radius: 50%;

            left: 3px;
            top: 2px;

            opacity: .7;
        }

        .login-brand {
            font-size: 1.65rem;

            font-weight: 900;

            letter-spacing: -.06em;

            color: #e8e3ce;
        }

        .login-description {
            margin-top: 3px;

            color: var(--text-muted);

            font-size: .76rem;

            font-weight: 500;
        }

        .login-body {
            padding: 24px;
        }

        .password {
            height: 48px;

            background: #11181d;

            border:
                1px solid rgba(255, 255, 255, .09);

            color: var(--text);

            border-radius: 12px;
        }

        .password::placeholder {
            color: #66727a;
        }

        .password:focus {
            background: #11181d;

            color: var(--text);

            border-color:
                rgba(216, 187, 76, .55);

            box-shadow:
                0 0 0 3px rgba(216, 187, 76, .10);
        }

        .login-button {
            height: 48px;

            border:
                1px solid rgba(216, 187, 76, .2);

            border-radius: 12px;

            background:
                linear-gradient(180deg,
                    #cdb34e,
                    #b39a3d);

            color: #171b1d;

            font-weight: 800;

            box-shadow:
                0 4px 0 #75652e;

            transition: .15s ease;
        }

        .login-button:hover {
            background:
                linear-gradient(180deg,
                    #d7bd57,
                    #bda344);

            color: #171b1d;
        }

        .login-button:active {
            transform: translateY(3px);

            box-shadow:
                0 1px 0 #75652e;
        }

        /* =========================================
           NAVBAR
        ========================================= */

        .navbar-bob {
            height: 60px;

            background:
                rgba(17, 24, 29, .88);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom:
                1px solid var(--border);

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .navbar-inner {
            width:
                min(calc(100% - 24px), 1180px);

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .brand {
            font-weight: 900;

            font-size: 1.15rem;

            letter-spacing: -.06em;

            color: #e4e6e7;
        }

        .brand-eye {
            display: inline-flex;

            width: 15px;
            height: 15px;

            background: #c5c9ca;

            border:
                2px solid #697278;

            border-radius: 50%;

            margin-left: 4px;

            vertical-align: -1px;

            position: relative;
        }

        .brand-eye::after {
            content: "";

            width: 4px;
            height: 4px;

            background: #252b2f;

            border-radius: 50%;

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);
        }

        /* =========================================
           MAIN
        ========================================= */

        .app-container {
            width:
                min(calc(100% - 24px), 1180px);

            margin: auto;

            padding:
                20px 0 35px;
        }

        /* =========================================
           STAT AREA
        ========================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 14px;
        }

        .stat-card {
            min-width: 0;

            position: relative;

            background:
                linear-gradient(145deg,
                    #1b252c,
                    #172026);

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 18px;

            overflow: hidden;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, .16);
        }

        .stat-card::before {
            content: "";

            position: absolute;

            width: 75px;
            height: 75px;

            right: -30px;
            top: -30px;

            background:
                var(--yellow-muted);

            border-radius: 50%;
        }

        .stat-card::after {
            content: "";

            position: absolute;

            height: 3px;

            left: 16px;
            right: 16px;

            bottom: 0;

            background:
                var(--blue);

            opacity: .65;

            border-radius:
                3px 3px 0 0;
        }

        .stat-label {
            position: relative;

            z-index: 2;

            color:
                var(--text-muted);

            font-size: .74rem;

            font-weight: 650;
        }

        .stat-value {
            position: relative;

            z-index: 2;

            margin-top: 5px;

            font-size:
                clamp(1.25rem, 3vw, 1.65rem);

            font-weight: 850;

            line-height: 1.15;

            color: var(--text);

            overflow-wrap: anywhere;
        }

        .weight {
            color: #d1b94f;
        }

        /* =========================================
           EMPTY SPACES
        ========================================= */

        .stats-empty {
            min-width: 0;
            min-height: 1px;
        }

        /* =========================================
           CHART
        ========================================= */

        .chart-card {
            margin-top: 14px;

            background:
                linear-gradient(145deg,
                    #1b252c,
                    #172026);

            border:
                1px solid var(--border);

            border-radius: 19px;

            padding: 19px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, .16);
        }

        .chart-header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .chart-title {
            margin: 0;

            color: #dfe4e6;

            font-size: .98rem;

            font-weight: 800;
        }

        .overall-badge {
            background:
                rgba(216, 187, 76, .12);

            border:
                1px solid rgba(216, 187, 76, .18);

            color:
                #cdb554;

            border-radius: 999px;

            padding:
                5px 10px;

            font-size: .68rem;

            font-weight: 800;
        }

        .chart-wrap {
            width: 100%;

            height: 320px;

            position: relative;
        }

        #c1 {
            width: 100% !important;
            height: 100% !important;
        }

        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .stats-empty {
                display: none;
            }

            .chart-wrap {
                height: 290px;
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 575px) {

            .login-card {
                border-radius: 23px;
            }

            .login-top {
                padding:
                    25px 18px 22px;
            }

            .login-body {
                padding: 20px;
            }

            .goggles {
                transform: scale(.88);

                margin-bottom: 5px;
            }

            .navbar-bob {
                height: 55px;
            }

            .app-container {
                width:
                    calc(100% - 16px);

                padding-top: 12px;
            }

            .stats-grid {
                gap: 9px;
            }

            .stat-card {
                padding: 14px;

                border-radius: 15px;
            }

            .stat-label {
                font-size: .69rem;
            }

            .stat-value {
                font-size: 1.17rem;
            }

            .chart-card {
                margin-top: 10px;

                padding: 14px;

                border-radius: 16px;
            }

            .chart-wrap {
                height: 235px;
            }
        }

        /* =========================================
           VERY SMALL MOBILE
        ========================================= */

        @media (max-width: 360px) {

            .app-container {
                width:
                    calc(100% - 12px);
            }

            .stats-grid {
                gap: 7px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-value {
                font-size: 1.05rem;
            }

            .chart-wrap {
                height: 205px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>


    <script>

        const CONFIG = {
            PASSWORD: "1",
            USE_REMOTE_DATA: true,
            DATA_URL: "https://raw.githubusercontent.com/minyonlar/data/refs/heads/main/bob/bob.json"
        };


        const LOCAL_DATA = [

            {
                date: "2026-01-01",
                weight: 60.9
            },

            {
                date: "2026-01-02",
                weight: 60.8
            }

        ];


        let healthData = [];

        let c1 = null;


        /* =========================================
           LOGIN
        ========================================= */

        function login() {

            const password =
                document.getElementById("pass");

            const error =
                document.getElementById("err");


            if (password.value !== CONFIG.PASSWORD) {

                error.innerText =
                    "hatalı parola";

                password.select();

                return;
            }


            error.innerText = "";


            document
                .getElementById("loginScreen")
                .classList.add("hidden");


            document
                .getElementById("app")
                .classList.remove("hidden");


            load();
        }


        /* =========================================
           LOAD
        ========================================= */

        async function load() {

            try {

                healthData =
                    CONFIG.USE_REMOTE_DATA

                        ? await (
                            await fetch(
                                CONFIG.DATA_URL
                            )
                        ).json()

                        : LOCAL_DATA;


                render();

                draw();

            } catch (error) {

                console.error(
                    "Veri yüklenemedi:",
                    error
                );

            }
        }


        /* =========================================
           LATEST
        ========================================= */

        function latest() {

            if (!healthData.length) {
                return null;
            }


            return [...healthData]
                .sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                )[0];
        }


        /* =========================================
           RENDER
        ========================================= */

        function render() {

            const data = latest();


            if (!data) {
                return;
            }


            document.getElementById("w").innerText =
                data.weight + " kg";


            document.getElementById("date").innerText =
                data.date;
        }


        /* =========================================
           CHART
        ========================================= */

        function draw() {

            const canvas =
                document.getElementById("c1");


            if (
                !canvas ||
                !healthData.length
            ) {
                return;
            }


            if (c1) {
                c1.destroy();
            }


            c1 = new Chart(
                canvas,
                {

                    type: "line",


                    data: {

                        labels:
                            healthData.map(
                                x => x.date
                            ),


                        datasets: [

                            {

                                label: "Kilo",


                                data:
                                    healthData.map(
                                        x =>
                                            x.weight ??
                                            null
                                    ),


                                borderColor:
                                    "#578aa9",


                                backgroundColor:
                                    "rgba(87,138,169,.08)",


                                borderWidth: 2.5,


                                pointBackgroundColor:
                                    "#cdb554",


                                pointBorderColor:
                                    "#6c8797",


                                pointBorderWidth: 2,


                                pointRadius: 3.5,


                                pointHoverRadius: 6,


                                tension: .35,


                                fill: true

                            }

                        ]

                    },


                    options: {

                        responsive: true,

                        maintainAspectRatio: false,


                        interaction: {

                            intersect: false,

                            mode: "index"

                        },


                        plugins: {

                            legend: {

                                display: false

                            },


                            tooltip: {

                                backgroundColor:
                                    "#0e1418",

                                borderColor:
                                    "rgba(255,255,255,.08)",

                                borderWidth: 1,

                                titleColor:
                                    "#e6eaec",

                                bodyColor:
                                    "#c7cfd3",

                                cornerRadius: 9,

                                padding: 10,


                                callbacks: {

                                    label:
                                        function (context) {

                                            const value =
                                                Number(
                                                    context.parsed.y
                                                ).toFixed(1);

                                            return ` ${value} kg`;
                                        }

                                }

                            }

                        },


                        scales: {

                            x: {

                                grid: {
                                    display: false
                                },

                                ticks: {

                                    color:
                                        "#68747c",

                                    maxRotation: 0,

                                    autoSkip: true,

                                    maxTicksLimit: 7

                                }

                            },


                            y: {

                                grid: {

                                    color:
                                        "rgba(255,255,255,.045)"

                                },


                                ticks: {

                                    color:
                                        "#68747c",

                                    /*
                                     * Floating point değerlerinin
                                     * 60.80000000012102 gibi
                                     * görünmesini engeller.
                                     */

                                    precision: 1,

                                    callback:
                                        function (value) {

                                            const rounded =
                                                Number(value)
                                                    .toFixed(1);

                                            return rounded + " kg";
                                        }

                                }

                            }

                        }

                    }

                }
            );
        }

    </script>

</head>


<body>


    <!-- ========================================
         LOGIN
    ========================================= -->

    <div id="loginScreen" class="login-wrap">

        <div class="login-card">


            <div class="login-top">

                <div class="hair hair-1"></div>
                <div class="hair hair-2"></div>
                <div class="hair hair-3"></div>


                <div class="goggles">

                    <div class="goggle-band"></div>


                    <div class="eye">

                        <div class="pupil"></div>

                    </div>


                    <div class="eye">

                        <div class="pupil"></div>

                    </div>

                </div>


                <div class="login-brand">
                    bob
                </div>


                <div class="login-description">

                </div>

            </div>


            <div class="login-body">


                <input autofocus id="pass" class="form-control password mb-2" type="password" placeholder="parola"
                    autocomplete="current-password" onkeypress="
                        if(event.key === 'Enter') login()
                    ">


                <button class="btn login-button w-100" onclick="login()">
                    giriş
                </button>


                <div id="err" class="text-danger small text-center mt-2"></div>

            </div>

        </div>

    </div>


    <!-- ========================================
         APP
    ========================================= -->

    <div id="app" class="hidden">


        <nav class="navbar-bob">

            <div class="navbar-inner">

                <div class="brand">

                    bob

                    <span class="brand-eye"></span>

                    <span class="brand-eye"></span>

                </div>

            </div>

        </nav>


        <main class="app-container">


            <!-- =================================
                 STATS
            ================================= -->

            <section class="stats-grid">


                <!-- KILO -->

                <div class="stat-card">

                    <div class="stat-label">
                        kilo
                    </div>


                    <div id="w" class="stat-value weight">
                        -
                    </div>

                </div>


                <!-- BOŞ ALAN -->

                <div class="stats-empty"></div>


                <!-- BOŞ ALAN -->

                <div class="stats-empty"></div>


                <!-- TARİH -->

                <div class="stat-card">

                    <div class="stat-label">
                        tarih
                    </div>


                    <div id="date" class="stat-value">
                        -
                    </div>

                </div>

            </section>


            <!-- =================================
                 CHART
            ================================= -->

            <section class="chart-card">


                <div class="chart-header">

                    <h2 class="chart-title">

                    </h2>


                    <span class="overall-badge">
                        bob
                    </span>

                </div>


                <div class="chart-wrap">

                    <canvas id="c1"></canvas>

                </div>

            </section>


        </main>

    </div>

</body>

</html>
